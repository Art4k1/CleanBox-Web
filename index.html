<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanBox</title>
<style>
:root{--bg:#f3f4f7;--panel:#fff;--text:#1c2333;--muted:#677084;--line:#e1e4ec;--accent:#2457d6;--accent-h:#1c46b0;--danger:#c8312f;--ok:#16794c;--hover:#f0f2f7;--sel:#e4ecfd;--head:#f8f9fb;--nav:#111a2e;color-scheme:light}
:root[data-theme=dark]{--bg:#12151c;--panel:#1a1e28;--text:#e7eaf2;--muted:#8b93a6;--line:#2a3040;--accent:#5b8cff;--accent-h:#7ea3ff;--danger:#ff6b70;--ok:#4cc38a;--hover:#222735;--sel:#223157;--head:#1f2430;--nav:#0b0f19;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}svg{flex-shrink:0;vertical-align:middle}input[type=checkbox]{accent-color:var(--accent)}
.app{height:100%;display:flex;flex-direction:column}
header{height:48px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 16px;gap:28px;flex-shrink:0}
.brand{user-select:none;display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
header nav{display:flex;height:100%}
.tab{background:none;border:0;color:#a9b3ca;padding:0 18px;height:100%;border-bottom:2px solid transparent;font-weight:500}
.tab:hover{color:#fff}.tab.on{color:#fff;border-color:#6d9bff}
.hr{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{background:rgba(255,255,255,.09);padding:4px 11px;border-radius:99px;font-size:12px;color:#c4cbe0}.chip b{color:#7ee0a9;font-weight:600}
.ib{background:none;border:0;color:#c4cbe0;padding:6px;border-radius:6px;display:flex}.ib:hover{background:rgba(255,255,255,.1)}
main{flex:1;min-height:0;display:flex}
.side{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
h4{margin:0 8px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pi{display:flex;border-radius:6px}.pi:hover{background:var(--hover)}.pi.on{background:var(--sel)}
.pi button:first-child{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:7px 8px;border:0;background:none;text-align:left}
.pi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pi .x{border:0;background:none;color:var(--muted);padding:0 8px}
.side .add{margin-top:10px;justify-content:center}
.ws{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.tb,.ab{display:flex;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ab{background:var(--head)}.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:0}.sc small{display:block}
.sc b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{flex:1;min-height:0;overflow:auto}
.sb{padding:6px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--head)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-weight:500}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.45;cursor:default}.btn:disabled:hover{background:var(--panel)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-h)}
.btn.d{color:var(--danger)}.btn.dp{background:var(--danger);border-color:var(--danger);color:#fff}.btn.dp:hover{filter:brightness(.92)}
.btn.sm{padding:3px 10px}.full{width:100%;justify-content:center;margin-top:16px}
.cmd{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}.cmd:last-child{border:0}
.cmd .btn{border-color:transparent;background:none}.cmd .btn:hover{background:var(--hover)}.cmd .btn:disabled:hover{background:none}
.ib2{background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;display:flex}.ib2:hover{background:var(--hover);border-color:var(--line)}
.bc{display:flex;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:1;min-width:140px}
.bc button{border:0;background:none;padding:3px 6px;border-radius:4px}.bc button:hover{background:var(--hover)}
.search{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:200px;color:var(--text);outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:grid;grid-template-columns:28px minmax(180px,2fr) 80px 110px 150px 80px;gap:10px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line);min-width:660px;user-select:none;cursor:default}
.frow{grid-template-columns:minmax(200px,3fr) 120px 90px 100px;min-width:460px}
.row.h{position:sticky;top:0;background:var(--head);color:var(--muted);font-size:12px;font-weight:600;z-index:1;padding-top:8px;padding-bottom:8px}.row.h span{cursor:pointer}.row.h span:hover{color:var(--text)}
.row:not(.h):hover{background:var(--hover)}.row.s{background:var(--sel)}.row.f{box-shadow:inset 3px 0 0 var(--accent)}
.nm{display:flex;gap:9px;align-items:center;min-width:0}.nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0}.tl.lg{width:56px;height:56px;font-size:26px;border-radius:12px}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:4px}.bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
small,.mut{color:var(--muted)}
.det{width:280px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto}
.dh{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.dh b{word-break:break-all;font-size:15px}.dh svg{width:56px;height:56px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;word-break:break-word;text-align:right}
#pv img{max-width:100%;max-height:180px;border-radius:6px;display:block;margin:0 auto 14px}
.dm{color:var(--muted);font-size:12px;line-height:1.5;margin-top:16px}
.top5{cursor:pointer;padding:6px 0}.top5>div:first-child{display:flex;justify-content:space-between;gap:8px}.top5 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:var(--muted);line-height:1.7}.empty b{color:var(--text);font-size:15px}
.lst{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:grid;gap:3px;margin:8px 0;font-size:12px}
#ov{position:fixed;inset:0;background:rgba(10,14,24,.5);display:none;place-items:center;z-index:50;padding:16px}#ov.on{display:grid}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(540px,100%);max-height:90%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}.mod.w{width:min(900px,100%)}
.mod h3{margin:0 0 10px;font-size:16px;font-weight:600}.mod .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mod input[type=text]{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}.mod input[type=text]:focus{border-color:var(--accent)}
.mod img,.mod video,.mod iframe{max-width:100%;max-height:70vh;border-radius:6px;border:0}.mod iframe{width:100%;height:70vh}
.mod pre{white-space:pre-wrap;word-break:break-word;max-height:65vh;overflow:auto;background:var(--bg);padding:12px;border-radius:6px;font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b303b;color:#fff;padding:9px 16px;border-radius:6px;display:none;z-index:60;max-width:80%}
@media(max-width:1000px){.det{display:none}}@media(max-width:760px){.side{display:none}.stats{grid-template-columns:1fr}}
.dov{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--sel)!important}
.atree{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:10px 0}
.atree summary{cursor:pointer;display:flex;gap:8px;align-items:center;padding:3px 0;list-style:none}.atree summary::-webkit-details-marker{display:none}
.atree summary::before{content:'▸';color:var(--muted);width:10px}.atree details[open]>summary::before{content:'▾'}
.atree .ar{display:flex;gap:8px;align-items:center;padding:3px 0 3px 18px}
.atree b{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.atree small{white-space:nowrap}
.ai{margin-left:5px;border-left:1px solid var(--line);padding-left:10px}
</style></head><body>
<div class="app">
<header><div class="brand"><i>C</i>CleanBox</div>
<nav><button class="tab on" data-a="view" data-v="files">Проводник</button><button class="tab" data-a="view" data-v="apps">Программы</button><button class="tab" data-a="avopen">Антивирус</button></nav>
<div class="hr"><span class="chip">Освобождено: <b id="fr">0 МБ</b></span><button class="ib" data-a="theme" title="Сменить тему"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button></div></header>
<main id="main"></main></div>
<div id="ov"><div class="mod" id="mod"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=b=>b==null?'…':!b?'—':b>=1e9?(b/1e9).toFixed(1)+' ГБ':b>=1e6?(b/1e6).toFixed(b>=1e8?0:1)+' МБ':b>=1e3?(b/1e3).toFixed(0)+' КБ':b+' Б';
const E=f=>async(...a)=>{try{await f(...a)}catch(e){if(e.name!='AbortError')toast('Ошибка: '+e.message)}};
const dt=m=>m?new Date(m).toLocaleDateString('ru-RU'):'—';
const OK=!!window.showDirectoryPicker;
let view='files',freed=0;
const svg=b=>`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${b}</svg>`;
const u=d=>svg(`<path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="${d}"/>`);
const FOLDER=svg('<path fill="#e3b341" d="M1.5 3.5a1 1 0 0 1 1-1h3.2L7 4h6.5a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/>');
const fileSvg=c=>svg(`<path fill="${c}" d="M3.5 1.5H9.5L13 5v9.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 .5-.5z"/><path fill="#fff" fill-opacity=".6" d="M9.5 1.5v3a.5.5 0 0 0 .5.5h3z"/>`);
const U={up:u('M8 13V3M4 7l4-4 4 4'),refresh:u('M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3'),nf:u('M2 4.5h4l1 1.5h7v6.5H2zM8 8v3M6.5 9.5h3'),nfi:u('M4 1.5h5l3 3v10H4zM8 8v4M6 10h4'),open:u('M6 3H3v10h10v-3M9 3h4v4M13 3L7 9'),edit:u('M3 13l.7-3L11 2.7 13.3 5 6 12.3zM9.5 4.2l2.3 2.3'),copy:u('M5.5 5.5h7v8h-7zM3.5 10.5v-8h7'),cut:u('M4.5 12a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM11.5 12a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM5.5 10.5 12 2.5M10.5 10.5 4 2.5'),paste:u('M5 3h6v2H5zM4 4H3.5v10h9V4H12M6 8h4M6 11h4'),trash:u('M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9M7 7v4M9 7v4'),plus:u('M8 3v10M3 8h10'),apps:u('M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z')};
const FCOL={};[['#2f9e6f','jpg jpeg png gif webp svg bmp ico'],['#8a5bd6','mp4 mkv avi mov webm'],['#d6568a','mp3 wav flac ogg m4a'],['#d6453d','pdf'],['#c47b2a','zip rar 7z tar gz'],['#3b7ddd','js ts py json html css xml bat ps1 sh cs cpp java'],['#2b6cc4','doc docx txt md rtf odt'],['#1f8a4c','xls xlsx csv ods'],['#5a6578','exe msi dll sys']].forEach(([c,t])=>t.split(' ').forEach(e=>FCOL[e]=c));
const fcol=n=>FCOL[(n.split('.').pop()||'').toLowerCase()]||'#8b94a3';
const hue=n=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
/* --- хранение выбранных папок (IndexedDB) --- */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('cleanbox',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const idbGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(_){}};
const idbSet=async(k,v)=>{try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(v,k)}catch(_){}};
async function ensure(h){if(await h.queryPermission({mode:'readwrite'})!=='granted'&&await h.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Нет доступа к папке')}
async function listDir(h){const a=[];for await(const [n,e] of h.entries()){let s=0,m=0,t='';if(e.kind==='file'){try{const f=await e.getFile();s=f.size;m=f.lastModified;t=f.type}catch(_){}}a.push({n,d:e.kind==='directory',h:e,s,m,t})}return a}
async function scan(h,a={size:0,files:0,latest:0,exe:false}){for await(const [n,e] of h.entries()){if(a.files>60000)break;if(n===TRASH)continue;if(e.kind==='directory')await scan(e,a);else{try{const f=await e.getFile();a.size+=f.size;a.files++;if(f.lastModified>a.latest)a.latest=f.lastModified;if(/\.exe$/i.test(n))a.exe=true}catch(_){}}}return a}
async function exists(d,n){try{await d.getFileHandle(n);return 1}catch(_){}try{await d.getDirectoryHandle(n);return 1}catch(_){}return 0}
async function copyTo(e,dest,name){if(e.kind==='file'){const f=await e.getFile(),w=await(await dest.getFileHandle(name,{create:true})).createWritable();await w.write(f);await w.close()}else{const nd=await dest.getDirectoryHandle(name,{create:true});for await(const [n,c] of e.entries())await copyTo(c,nd,n)}}
/* ================= ПРОВОДНИК ================= */
let roots=[],stack=[],items=[],sel=new Set(),q='',sk='name',sd=1,clip=null,last=null;
const cur=()=>stack[stack.length-1];
async function shellFiles(){
 if(!roots.length)roots=(await idbGet('roots'))||[];
 $('#main').innerHTML=`<aside class="side" id="pl"></aside><section class="ws">
 <div class="tb"><div class="cmd"><button class="btn" data-a="mk">${U.nf}Новая папка</button><button class="btn" data-a="mkf">${U.nfi}Новый файл</button></div><div class="cmd"><button class="btn" data-a="open" id="b0">${U.open}Открыть</button><button class="btn" data-a="ren" id="b1">${U.edit}Переименовать</button></div><div class="cmd"><button class="btn" data-a="copy" id="b2">${U.copy}Копировать</button><button class="btn" data-a="cut" id="b3">${U.cut}Вырезать</button><button class="btn" data-a="paste" id="b4">${U.paste}Вставить</button></div><div class="cmd"><button class="btn" data-a="dup" id="b6">${U.copy}Дублировать</button><button class="btn" data-a="dl" id="b7">Скачать</button><button class="btn" data-a="avsel" id="b8">Проверить антивирусом</button></div><div class="cmd"><button class="btn" data-a="selall">Выделить всё</button><button class="btn" data-a="selnone" id="b9">Снять выделение</button><button class="btn" data-a="selinv">Инвертировать</button></div><div class="cmd"><button class="btn" data-a="trash" id="btr">Корзина</button><button class="btn d" data-a="del" id="b5">${U.trash}Удалить</button></div></div>
 <div class="ab"><button class="ib2" data-a="up" title="Вверх">${U.up}</button><button class="ib2" data-a="refresh" title="Обновить">${U.refresh}</button><div class="bc" id="bc"></div><input class="search" id="q" placeholder="Поиск в папке" value="${esc(q)}"></div>
 <div class="card" id="body"></div><div class="sb" id="st"></div></section><aside class="det" id="det"></aside>`;
 $('#q').oninput=e=>{q=e.target.value;upFiles()};upFiles()}
function upPlaces(){const on=stack[0];$('#pl').innerHTML='<h4>Рабочие папки</h4>'+roots.map((h,i)=>`<div class="pi ${on&&on.h===h?'on':''}"><button data-a="root" data-i="${i}">${FOLDER}<span>${esc(h.name)}</span></button><button class="x" data-a="unroot" data-i="${i}" title="Убрать из списка">×</button></div>`).join('')+`<button class="btn add" data-a="addroot">${U.plus}Добавить папку</button>`}
async function load(){items=(await listDir(cur().h)).filter(x=>x.n!==TRASH);sel.clear();upFiles()}
function upFiles(){
 if(view!='files'||!$('#body'))return;upPlaces();{const t=$('#btr');if(t)t.textContent='Корзина'+(trash.length?` (${trash.length})`:'')}
 const btns=['b0','b1','b2','b3','b4','b5','b6','b7','b8','b9'];
 if(!OK){$('#body').innerHTML='<div class="empty"><b>Нужен Chrome или Edge</b><br>В этом браузере нет доступа к файлам.</div>';return}
 if(!stack.length){$('#bc').innerHTML='';$('#st').textContent='';btns.forEach(i=>$('#'+i).disabled=true);
  $('#body').innerHTML='<div class="empty"><b>Папка не выбрана</b><br>Добавьте папку, с которой хотите работать.<br>Браузер запросит разрешение на чтение и запись.<br><button class="btn p" data-a="addroot" style="margin-top:14px">Добавить папку</button></div>';det();return}
 const l=items.filter(x=>x.n.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.d-a.d)||((sk=='name'?a.n.localeCompare(b.n,'ru',{numeric:true}):(a[sk]-b[sk]))*sd));window._vis=l;
 const ar=k=>sk==k?(sd>0?' ▲':' ▼'):'';
 $('#bc').innerHTML=stack.map((c,i)=>`<button data-a="crumb" data-i="${i}"${i<stack.length-1?` data-di="${i}"`:''}>${esc(c.n)}</button>`).join('<span class="mut">›</span>');
 $('#body').innerHTML=`<div class="row h frow"><span data-a="sort" data-k="name">Имя${ar('name')}</span><span data-a="sort" data-k="m">Изменено${ar('m')}</span><span data-a="sort" data-k="s">Размер${ar('s')}</span><span>Тип</span></div>`+
 (l.map(x=>`<div class="row frow ${sel.has(x.n)?'s':''}" data-a="it" data-n="${esc(x.n)}" draggable="true"${x.d?` data-dn="${esc(x.n)}"`:''}><div class="nm">${x.d?FOLDER:fileSvg(fcol(x.n))}<b title="${esc(x.n)}">${esc(x.n)}</b></div><span class="mut">${dt(x.m)}</span><span>${x.d?'':fmt(x.s)}</span><span class="mut">${x.d?'Папка':esc((x.n.split('.').pop()||'').toUpperCase())}</span></div>`).join('')||'<div class="empty">Папка пуста</div>');
 const s=picked();
 $('#st').textContent=`Элементов: ${items.length}`+(s.length?` · выбрано: ${s.length} (${fmt(s.reduce((t,x)=>t+x.s,0))})`:'')+(clip?` · в буфере: ${clip.items.length} (${clip.cut?'вырезано':'копия'})`:'');
 $('#b0').disabled=s.length!=1;$('#b1').disabled=s.length!=1;$('#b2').disabled=!s.length;$('#b3').disabled=!s.length;$('#b4').disabled=!clip;$('#b5').disabled=!s.length;$('#b6').disabled=!s.length;$('#b7').disabled=!(s.length==1&&!s[0].d);$('#b8').disabled=false;$('#b9').disabled=!s.length;det()}
let dtk=0;
async function det(){const id=++dtk,el=$('#det');if(!el)return;if(window._pu){URL.revokeObjectURL(window._pu);window._pu=null}

async function rmDeep(dir,name,r){
 try{await dir.removeEntry(name,{recursive:true});return true}catch(e){}
 let sub;try{sub=await dir.getDirectoryHandle(name)}catch(e){try{await dir.removeEntry(name);return true}catch(e2){r.err.push(name+': '+e2.name);return false}}
 let ok=true;for await(const [n,h] of sub.entries()){if(h.kind==='directory'){if(!await rmDeep(sub,n,r))ok=false}else{try{await sub.removeEntry(n)}catch(e){ok=false;r.err.push(n+': '+(e.name=='NoModificationAllowedError'?'файл занят другой программой':e.message))}}}
 if(ok){try{await dir.removeEntry(name);return true}catch(e){r.err.push(name+': '+e.message)}}
 return false}

async function avScan(dir,path,st){
 for await(const [n,e] of dir.entries()){
  if(av.stop||av.n>60000)return;
  const p=path+'/'+n;if(n===TRASH)continue;
  if(e.kind==='directory'){await avScan(e,p,st);continue}
  av.n++;if(Date.now()-st.t>150){st.t=Date.now();avUpd(p);await new Promise(r=>setTimeout(r))}
  try{
   const f=await e.getFile(),why=[];let lv=0;const add=(l,w)=>{if(!why.includes(w))why.push(w);lv=Math.max(lv,l)};
   if(ARCH.test(n)&&(f.size<5e8||/\.zip$/i.test(n))){try{const l=/\.zip$/i.test(n)?await zipList(f):await tarList(f,/\.(tgz|gz)$/i.test(n));for(const w of archWarn(l,f.size).slice(0,3))add(w.l,'В архиве: '+w.why+(w.p?' — '+w.p:''))}catch(_){}}
    const head=new Uint8Array(await f.slice(0,4096).arrayBuffer());
   if(f.size<2000&&new TextDecoder('latin1').decode(head).includes(EICAR))add(3,'Тестовая вирусная сигнатура EICAR');
   if(head[0]==0x4D&&head[1]==0x5A&&f.size>1024&&!AVX.test(n))add(AVDOC.test(n)?3:2,'Это программа (EXE), замаскированная под другой тип файла');
   if(AVDBL.test(n))add(3,'Двойное расширение — типичный приём маскировки');
   else if(AVRISK.test(n))add(1,'Тип файла, который часто используют вредоносные программы');
   if(/^autorun\.inf$/i.test(n))add(2,'Автозапуск со съёмного носителя');
   if(AVTXT.test(n)&&f.size<1e6){const t=await f.text();for(const [re,l,w] of AVPAT)if(re.test(t))add(l,w)}
   if(lv)av.res.push({p,n,dir,s:f.size,lv,why});
  }catch(_){}
 }}
